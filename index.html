<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ أحمد عاطف - شريط التحميل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-white h-screen flex justify-center items-center overflow-hidden m-0 p-0">

    <div class="relative bg-white border border-slate-100 shadow-2xl p-8 rounded-3xl text-center w-11/12 max-w-md text-slate-800">
        
        <!-- Soft background glow effect -->
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 w-32 h-32 bg-blue-100/60 rounded-full blur-2xl"></div>

        <div class="relative mb-6 flex justify-center">
            <div class="w-28 h-28 rounded-2xl p-2 bg-gradient-to-tr from-blue-600 to-cyan-500 shadow-xl flex items-center justify-center animate-pulse">
                <img src="https://i.postimg.cc/JhFWqtKr/icon-1.png" 
                     onerror="this.src='https://placehold.co/150x150/004080/ffffff?text=AT+Academy'" 
                     alt="AT Academy Logo" 
                     class="w-full h-full object-cover rounded-xl bg-white">
            </div>
        </div>

        <h1 class="text-xl font-bold mb-2 tracking-wide text-blue-900 leading-relaxed">
            جارى الدخول لمنصة الاستاذ احمد عاطف
        </h1>
        <p class="text-slate-500 text-sm mb-6">جاري تهيئة النظام والموارد...</p>

        <div class="w-full bg-slate-100 rounded-full h-4 p-0.5 overflow-hidden border border-slate-200 shadow-inner mb-4">
            <div id="progressBar" class="h-full bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full transition-all duration-75 ease-linear" style="width: 10%;"></div>
        </div>

        <div class="flex justify-between items-center text-sm font-semibold px-1">
            <span class="text-slate-500">التقدم</span>
            <span id="counterText" class="text-blue-600 text-lg font-bold">10%</span>
        </div>
    </div>

    <script>
        function startLoader() {
            const progressBar = document.getElementById('progressBar');
            const counterText = document.getElementById('counterText');

            let currentProgress = 10; // يبدأ من 10%
            const targetProgress = 100; // ينتهي عند 100%
            const duration = 3000; // المدة بالمللي ثانية (3 ثواني)
            const intervalTime = 30; // معدل التحديث
            const totalSteps = duration / intervalTime;
            const increment = (targetProgress - currentProgress) / totalSteps;

            if (window.loaderTimer) clearInterval(window.loaderTimer);

            window.loaderTimer = setInterval(() => {
                currentProgress += increment;

                if (currentProgress >= targetProgress) {
                    currentProgress = targetProgress;
                    clearInterval(window.loaderTimer);

                    // التوجيه التلقائي بعد اكتمال العداد مباشرة
                    setTimeout(() => {
                        window.location.href = "https://script.google.com/macros/s/AKfycby0du6vDHxHfjJknu3xwlyHPew81Rg40cNPVxhBpvS4Yi-ZzsXUd3NdkT_Ju5C1ijT4Yw/exec";
                    }, 300);
                }

                const rounded = Math.round(currentProgress);
                progressBar.style.width = rounded + '%';
                counterText.textContent = rounded + '%';
            }, intervalTime);
        }

        // بدء العداد فور تحميل الصفحة
        window.onload = startLoader;
    </script>

</body>
</html>
